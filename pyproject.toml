[project]
name = "sycophancy-probe"
version = "0.1.0"
description = "Red-teaming + evals tool for studying sycophantic behavior in LLMs"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.25.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "sentence-transformers>=3.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.scripts]
probe = "run:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
